<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Marca do app MVO: o "m" feito de dois arcos de voo, com o avião laranja e o rastro tracejado.
       Fundo inteiro (o Android e o iPhone arredondam o ícone); o desenho fica dentro da área segura central. -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5bc0"/>
      <stop offset=".55" stop-color="#12326a"/>
      <stop offset="1" stop-color="#0b1f4b"/>
    </linearGradient>
    <radialGradient id="sol" cx=".92" cy=".95" r=".7">
      <stop offset="0" stop-color="#ff914d" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff914d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilho" cx=".2" cy=".05" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe5f5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ceu)"/>
  <rect width="512" height="512" fill="url(#sol)"/>
  <rect width="512" height="512" fill="url(#brilho)"/>
  <!-- rastro do voo -->
  <path d="M118 214 Q 210 92 352 150" fill="none" stroke="#ff914d" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 30" opacity=".95"/>
  <!-- o m: duas pernas e dois arcos -->
  <path d="M150 372 V 262 A 53 53 0 0 1 256 262 V 372 M256 262 A 53 53 0 0 1 362 262 V 372"
        fill="none" stroke="url(#letra)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- avião -->
  <g transform="translate(378 146) rotate(62) scale(3.1) translate(-12 -12)">
    <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="#ff914d"/>
  </g>
</svg>
