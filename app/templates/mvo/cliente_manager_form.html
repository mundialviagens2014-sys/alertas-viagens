{% extends "base.html" %}
{% block titulo %}Novo cliente{% endblock %}
{% block conteudo %}
<div class="topo">
  <div>
    <h1>Novo cliente</h1>
    <p class="sub">O cliente também aparece nos alertas, onde dá para cadastrar os trechos que ele quer.</p>
  </div>
  <a class="btn" href="/manager/clientes">← Clientes</a>
</div>

<form class="cartao" method="post" action="/manager/clientes/novo" style="max-width:820px">
  <div class="campos">
    <div style="grid-column:1/-1"><label for="nome">Nome completo *</label><input id="nome" name="nome" type="text" value="{{ dados.nome or '' }}" required autofocus></div>
    <div><label for="telefone">WhatsApp *</label><input id="telefone" name="telefone" type="tel" value="{{ dados.telefone|telefone if dados.telefone else '' }}" required placeholder="(85) 99999-9999"></div>
    <div><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ dados.email or '' }}"></div>
    <div><label for="documento">CPF / CNPJ</label><input id="documento" name="documento" type="text" inputmode="numeric" value="{{ dados.documento|cpf if dados.documento else '' }}"></div>
    <div><label for="data_nascimento">Data de nascimento</label><input id="data_nascimento" name="data_nascimento" type="date" value="{{ dados.data_nascimento|iso }}"></div>
    <div><label for="classificacao">Classificação</label><input id="classificacao" name="classificacao" type="text" list="lista-classificacoes" value="{{ dados.classificacao or '' }}" placeholder="ex.: VIP"></div>
    <div style="grid-column:1/-1"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" style="min-height:80px">{{ dados.observacoes or '' }}</textarea></div>
  </div>
  <label class="campo-check" style="margin-top:1rem"><input type="checkbox" name="consentimento" value="true"><span>Autorizou receber promoções pelo WhatsApp</span></label>
  <div class="acoes" style="margin-top:1rem"><button class="btn primario">Cadastrar cliente</button></div>
</form>
{% include "mvo/_classificacoes.html" %}
{% endblock %}
