{% extends "base.html" %}
{% block titulo %}Novo colaborador{% endblock %}
{% block conteudo %}
<div class="topo">
  <div>
    <h1>Novo colaborador</h1>
    <p class="sub">Depois de salvar, você adiciona as contas dele nos programas (Smiles, LATAM Pass...).</p>
  </div>
  <a class="btn" href="/colaboradores">← Colaboradores</a>
</div>

<form class="cartao" method="post" action="/colaboradores/novo" style="max-width:820px">
  <div class="campos">
    <div style="grid-column:1/-1"><label for="nome">Nome completo *</label><input id="nome" name="nome" type="text" value="{{ dados.nome or '' }}" required autofocus></div>
    <div><label for="cpf">CPF</label><input id="cpf" name="cpf" type="text" inputmode="numeric" value="{{ dados.cpf|cpf if dados.cpf else '' }}" placeholder="000.000.000-00"></div>
    <div><label for="telefone">Telefone / WhatsApp</label><input id="telefone" name="telefone" type="tel" value="{{ dados.telefone|telefone if dados.telefone else '' }}"></div>
    <div><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ dados.email or '' }}"></div>
    <div><label for="pix">Chave PIX</label><input id="pix" name="pix" type="text" value="{{ dados.pix or '' }}"></div>
    <div><label for="classificacao">Classificação</label><input id="classificacao" name="classificacao" type="text" value="{{ dados.classificacao or '' }}" placeholder="ex.: parceiro fixo"></div>
    <div><label for="consolidador">Indicado por / grupo</label><input id="consolidador" name="consolidador" type="text" value="{{ dados.consolidador or '' }}"></div>
    <div style="grid-column:1/-1"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" style="min-height:80px">{{ dados.observacoes or '' }}</textarea></div>
  </div>
  <div class="acoes" style="margin-top:1rem"><button class="btn primario">Salvar e adicionar contas</button></div>
</form>
{% endblock %}
