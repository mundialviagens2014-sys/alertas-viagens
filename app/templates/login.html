{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block publico %}
<div class="login">
  <div class="login-caixa">
    <img class="logo" src="/static/logo.png?v={{ versao }}" alt="{{ agencia }}" width="260" height="110" style="max-width:260px; height:auto">
    <form class="cartao" method="post" action="/login">
      <h1>Bem-vindo de volta</h1>
      <p class="sub">Acesso da equipe ao sistema de alertas de promoções.</p>
      {% for a in avisos %}<div class="aviso {{ a.tipo }}">{{ a.texto }}</div>{% endfor %}
      <div style="display:grid; gap:1rem">
        <div><label for="login">Login</label><input id="login" name="login" type="text" autocomplete="username" required autofocus></div>
        <div><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
        <button class="btn primario" type="submit" style="padding:.7rem">Entrar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
