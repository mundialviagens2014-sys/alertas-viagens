# Robô de reservas do MVO, na nuvem do GitHub (grátis em repositório público).
# Lê no site da LATAM/GOL/Azul as reservas pedidas na tela Bilhetes do MVO e devolve para gerar o PDF.
#
# Segredos (Settings → Secrets and variables → Actions → New repository secret):
#   MVO_URL     endereço do MVO, ex.: https://mvo.mundialviagens.com
#   ROBO_TOKEN  token gerado em MVO → Configurações → Robô de reservas
#   NAVEGADOR_WS_URL  opcional: navegador remoto (Browserless), ex.: wss://production-sfo.browserless.io?token=...
#                     sem ele, o robô usa o Chrome do próprio GitHub
#
# Quando roda: na hora em que alguém pede um bilhete (se o Render tiver GITHUB_TOKEN_ROBO), a cada 10 minutos
# (para pegar o que ficou na fila) e pelo botão "Run workflow". Sem pedido na fila, termina em segundos.
# O registro (log) é público: o robô só escreve o número do pedido e o resultado.
name: Robô de reservas

on:
  repository_dispatch:
    types: [bilhete]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: robo-reservas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MVO_URL: ${{ secrets.MVO_URL }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
      NAVEGADOR_WS_URL: ${{ secrets.NAVEGADOR_WS_URL }}
    steps:
      - name: Tem pedido na fila?
        id: fila
        run: |
          if [ -z "$MVO_URL" ] || [ -z "$ROBO_TOKEN" ]; then
            echo "Faltam os segredos MVO_URL e ROBO_TOKEN (veja o topo deste arquivo)."
            echo "### Robô de reservas: faltam os segredos MVO_URL e ROBO_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            echo "pendentes=0" >> "$GITHUB_OUTPUT"; exit 1
          fi
          codigo=$(curl -s -m 90 -o resposta.json -w "%{http_code}" -X POST -H "Authorization: Bearer $ROBO_TOKEN" \
            -H "X-Robo-Maquina: GitHub Actions" "${MVO_URL%/}/api/robo/fila" || echo "sem-resposta")
          n=$(python3 -c "import json; print(json.load(open('resposta.json')).get('pendentes', 0))" 2>/dev/null || echo 0)
          case "$codigo" in
            200) motivo="pedidos na fila: $n" ;;
            401) motivo="o MVO recusou o ROBO_TOKEN. Gere o token em MVO > Configurações > Robô de reservas e troque o segredo." ;;
            404) motivo="endereço errado no segredo MVO_URL (o MVO respondeu 404). Use https://mvo.mundialviagens.com" ;;
            *)   motivo="o MVO não respondeu direito (código $codigo). Confira o segredo MVO_URL." ;;
          esac
          echo "Robô de reservas: $motivo"
          echo "### Robô de reservas: $motivo" >> "$GITHUB_STEP_SUMMARY"
          echo "pendentes=$n" >> "$GITHUB_OUTPUT"
          if [ "$codigo" != "200" ]; then exit 1; fi

      - uses: actions/checkout@v4
        if: steps.fila.outputs.pendentes != '0'
        with:
          sparse-checkout: robo

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.pendentes != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requisitos.txt

      - name: Instalar o robô
        if: steps.fila.outputs.pendentes != '0'
        run: |
          pip install -q -r robo/requisitos.txt
          # o Google Chrome já vem instalado no computador do GitHub; o Chromium fica de reserva
          python -m playwright install chromium

      - name: Consultar as reservas
        if: steps.fila.outputs.pendentes != '0'
        working-directory: robo
        run: python robo_reservas.py --nuvem
